
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "net.fabricmc.fabric-loom" version "$fabric_loom_version"
    id "com.gradleup.shadow"
}

base {
    archivesName = "${mod_id}"
}

configurations {
    shadow
    implementation.extendsFrom(shadow)
}

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    implementation group: 'org.ow2.asm', name: 'asm-tree', version: '9.7'
    annotationProcessor group: 'org.ow2.asm', name: 'asm-util', version: '9.7'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
    shadow "net.objecthunter:exp4j:0.4.8"
    shadow("com.jayway.jsonpath:json-path:2.9.0") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    shadow("net.minidev:json-smart:2.6.0") {
        exclude group: "org.ow2.asm", module: "asm"
    }
    compileOnly "com.github.Keksuccino:japng:${japng_version}"
    compileOnly "com.github.rtyley:animated-gif-lib-for-java:animated-gif-lib-${animated_gif_lib_version}"
    compileOnly "maven.modrinth:melody:${melody_artifact_version}-fabric"
    compileOnly "de.keksuccino:rinku-fabric:${rinku_artifact_version}"
    compileOnly "maven.modrinth:watermedia:${watermedia_version}"

}

loom {
    if (file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(file("src/main/resources/${mod_id}.accesswidener"))
    }
}

tasks.named("shadowJar") {
    archiveClassifier.set("shadow")
    configurations = [project.configurations.shadow]
    mergeServiceFiles()
    exclude 'org/slf4j/**'
    exclude 'org/objectweb/asm/**'
    relocate 'com.jayway.jsonpath', 'de.keksuccino.com.jayway.jsonpath'
    relocate 'net.minidev', 'de.keksuccino.net.minidev'
    relocate 'net.objecthunter.exp4j', 'de.keksuccino.net.objecthunter.exp4j'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
