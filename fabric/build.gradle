
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "net.fabricmc.fabric-loom" version "$fabric_loom_version"
    id "com.gradleup.shadow"
}

base {
    archivesName = "${mod_id}"
}

configurations {
    shadow
    implementation.extendsFrom(shadow)
}

dependencies {

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "com.google.code.findbugs:jsr305:3.0.2"
    // Shared sources are compiled into this module and registered with Loom below.
    compileOnly project(":common")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    shadow "net.objecthunter:exp4j:0.4.8"
    shadow("com.jayway.jsonpath:json-path:2.9.0") {
        exclude group: "org.slf4j", module: "slf4j-api"
    }
    shadow("net.minidev:json-smart:2.6.0") {
        exclude group: "org.ow2.asm", module: "asm"
    }
    runtimeOnly "maven.modrinth:modmenu:${modmenu_version}"

}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet("main", ":common")
            configuration configurations.shadow
        }
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("../run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("../run_server")
        }
    }
}

tasks.named("jar") {
    archiveClassifier.set("unshaded")
}

tasks.named("shadowJar", Jar) { shadowJar ->
    archiveClassifier.set("")
    configurations = [project.configurations.shadow]
    mergeServiceFiles()
    exclude 'org/slf4j/**'
    exclude 'org/objectweb/asm/**'
    relocate 'com.jayway.jsonpath', 'de.keksuccino.com.jayway.jsonpath'
    relocate 'net.minidev', 'de.keksuccino.net.minidev'
    relocate 'net.objecthunter.exp4j', 'de.keksuccino.net.objecthunter.exp4j'

    def processIncludeJars = tasks.named("processIncludeJars", net.fabricmc.loom.build.nesting.NestableJarGenerationTask)
    dependsOn processIncludeJars

    def nestedJars = project.fileTree(processIncludeJars.flatMap { it.outputDirectory }) {
        include "*.jar"
    }
    net.fabricmc.loom.task.NestJarsAction.addToTask(shadowJar, nestedJars)
}

tasks.named("assemble") {
    dependsOn tasks.shadowJar
}

tasks.named("compileJava", JavaCompile) {
    source(project(":common").sourceSets.main.allSource)
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = base.archivesName.get()
            artifact tasks.shadowJar
            artifact tasks.sourcesJar
        }
    }
    repositories {
        maven {
            url = "file://" + System.getenv("local_maven")
        }
    }
}
